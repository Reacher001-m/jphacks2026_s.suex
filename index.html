<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101923">
    <title>ショートカット・ダンジョン</title>
    <link rel="stylesheet" href="./styles/main.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="page-heading">
        <div class="heading-copy">
          <p class="eyebrow"><span class="eyebrow-dot"></span>KEYBOARD TRAINING • 2D DUNGEON</p>
          <h1>ショートカット<span>・ダンジョン</span></h1>
          <p class="page-lead">キー操作で迷宮を進み、ショートカットを身体で覚えよう。</p>
        </div>
        <div class="heading-badge" aria-hidden="true">
          <span>CTRL</span>
          <span>+</span>
          <span>KEY</span>
        </div>
      </header>
      <div class="canvas-frame">
        <canvas
          id="game-canvas"
          width="960"
          height="640"
          tabindex="0"
          aria-label="矢印キーまたはWASDでプレイヤーを移動するダンジョンゲーム"
        ></canvas>
      </div>
      <footer>
        <span class="footer-item"><span class="footer-key">矢印 / WASD</span>移動</span>
        <span class="footer-item"><span class="footer-key">Ctrl + C / V / X / Z</span>ショートカット</span>
        <span class="footer-item"><span class="footer-key">Enter / R</span>リトライ</span>
      </footer>
    </main>
  </body>
</html>
