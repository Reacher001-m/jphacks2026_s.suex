<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101923">
    <title>ショートカット・ダンジョン</title>
    <link rel="stylesheet" href="./styles/main.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="page-heading">
        <p class="eyebrow">KEYBOARD TRAINING • 2D DUNGEON</p>
        <h1>ショートカット・ダンジョン</h1>
        <p>キー操作で迷宮を進み、ショートカットを練習しよう。</p>
      </header>
      <canvas
        id="game-canvas"
        width="960"
        height="640"
        tabindex="0"
        aria-label="矢印キーまたはWASDでプレイヤーを移動するダンジョンゲーム"
      ></canvas>
      <footer>矢印キー / WASD で移動　·　Ctrl/Cmd+C・V・Z などを入力して練習</footer>
    </main>
  </body>
</html>
